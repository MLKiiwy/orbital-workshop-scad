# CI: the same checks as the git hooks (mise run check) plus full renders.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5   # installs the tools pinned in mise.toml
      - run: mise run fmt:check
      - run: mise run lint

  validate:
    name: Validate + render
    runs-on: ubuntu-latest
    # OpenSCAD development snapshot (Manifold backend), pinned for reproducible
    # results; bump the date tag when updating the local snapshot.
    container: openscad/openscad:dev.2026-11-23
    steps:
      - name: Install git and python3
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3 ca-certificates
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # libraries in libs/ + the openscad skill
      - name: Trust the workspace (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: openscad --version
      - run: scripts/check-openscad.sh
      - name: Validate (openscad skill), render models and MakerWorld copies
        run: scripts/validate.sh --render
